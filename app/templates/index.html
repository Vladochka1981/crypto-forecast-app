<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Forecast App</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/lightweight-charts.standalone.production.js"></script>
    <link rel="icon" href="data:,">
</head>
<body>
    <h1>Crypto Forecast App</h1>
    <p>Прогнозирование курса Bitcoin с помощью Attention-GRU и ARIMAX-LSTM.</p>

    <!-- ===== Управление (горизонтально) ===== -->
    <div class="card card-control-horizontal">
        <div class="controls-row">
            <div class="control-item">
                <label for="model">Модель:</label>
                <select id="model">
                    <option value="attention_gru">Attention-GRU</option>
                    <option value="arimax_lstm">ARIMAX-LSTM</option>
                    <option value="auto">Обе модели</option>
                </select>
            </div>
            <div class="control-item">
                <label for="model-version">Версия:</label>
                <select id="model-version">
                    <option value="">Текущая (deploy)</option>
                </select>
            </div>
            <div class="control-item">
                <label for="horizon">Горизонт:</label>
                <select id="horizon">
                    <option value="1">4 часа (h=1)</option>
                    <option value="3">12 часов (h=3)</option>
                    <option value="6">24 часа (h=6)</option>
                    <option value="12">48 часов (h=12)</option>
                    <option value="18">72 часа (h=18)</option>
                    <option value="all" selected>Все горизонты</option>
                </select>
            </div>
            <div class="control-item">
                <button id="btn-forecast" onclick="runForecast()">Запустить прогноз</button>
            </div>
            <div class="control-item summary-item">
                <div id="summary" class="summary" style="display:none;"></div>
            </div>
        </div>
    </div>

    <!-- ===== Основной блок: Model quality | График | 3 карточки ===== -->
    <div class="main-layout">
        <!-- Model quality (вертикально) -->
        <div class="card card-quality">
            <h3>Model quality</h3>
            <div id="model-quality-body" class="dash-body">Загрузка...</div>
            <div id="backtest-body" class="backtest"></div>
            <div id="comparison-body" class="comparison"></div>
            
        </div>

        <!-- График -->
        <div class="card chart-panel">
            <h3>График</h3>
            <div id="chart"></div>
            <div id="macd-chart"></div>
            <div id="volume-chart"></div>
            <div id="forecast-result"></div>
        </div>

        <!-- 3 карточки стёком -->
        <div class="right-cards">
            <div class="card card-fng">
                <h3>Fear &amp; Greed</h3>
                <div id="fng-body" class="dash-body" style="text-align:center;">Загрузка...</div>
            </div>
            <div class="card card-price">
                <h3>BTC / USD</h3>
                <div id="price-body" class="dash-body">Загрузка...</div>
            </div>
            <div class="card card-signal">
                <h3>Trading Signal</h3>
                <div id="signal-body" class="dash-body">Загрузка...</div>
            </div>
            
         </div>
    </div>

    <!-- ===== Data status (внизу, горизонтально) ===== -->
    <div class="card card-status-bottom" style="display: flex; flex-direction: column;">
        <h3>Data status</h3>
        
        <!-- Контейнер для статусов и кнопок в один ряд -->
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: nowrap; gap: 15px; width: 100%;">
            
            <!-- Сами статусы данных -->
            <div id="status-body" class="status-grid" style="display: flex; align-items: center; justify-content: space-around; gap: 15px; flex-grow: 1;">Загрузка...</div>
            
            <!-- Плашка переобучения -->
            <div style="flex-shrink: 0; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 6px 12px; font-size: 0.85em; color: #495057;">
                Последнее переобучение: <b id="last-retrain-date">—</b>
            </div>
            <!-- Блок с кнопками -->
            <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
                <button id="btn-retrain" class="btn btn-sm btn-warning" onclick="triggerRetrain()" style="white-space: nowrap; background-color: #ff9800; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">
                    🔄 Переобучить (3 часа)
                </button>
                <button id="btn-export" onclick="exportCsv()" style="white-space: nowrap; background-color: #2196f3; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">
                    📥 Скачать CSV
                </button>
                <span id="retrain-status" style="font-size: 0.85em; color: #666; white-space: nowrap;"></span>
            </div>
        </div>

        <div id="warnings-body" class="warnings" style="margin-top: 10px;"></div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
